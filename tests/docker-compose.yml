services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    environment:
      COLLECTIONS: "crowdsecurity/appsec-generic-rules crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-crs crowdsecurity/appsec-crs-inband crowdsecurity/appsec-bot-challenge"
      BOUNCER_KEY_envoy: "test-bouncer-key"
      DISABLE_PARSERS: "crowdsecurity/whitelists"
      APPSEC_CONFIGS: "crowdsecurity/appsec-default"
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml
      - ./crowdsec/appsec-configs:/etc/crowdsec/appsec-configs
      - crowdsec-db:/var/lib/crowdsec/data/
      - crowdsec-config:/etc/crowdsec/
    healthcheck:
      # cscli version alone only proves the LAPI is answering, not that the AppSec
      # engine has finished loading its rule collections - it keeps listening on 7422
      # and returning 503 for a real window after that (measured ~50s locally with warm
      # image layers; a fresh/CPU-constrained CI runner compiling CRS's regexes can take
      # noticeably longer). Every envoy-* service gates its own startup on this
      # healthcheck, and with fail_open: false a request that lands in that window is a
      # hard 403 - which is indistinguishable from "not ready" to run_tests.sh's own
      # readiness probe, and is the direct cause of a "Waiting for Envoy to be ready"
      # timeout in CI. A bare unauthenticated request to the AppSec port is a stable,
      # protocol-level signal that the engine is actually serving: it reliably returns
      # 401 once ready, regardless of which collections are loaded.
      test: ["CMD-SHELL", "cscli version >/dev/null 2>&1 && wget -q -S -O /dev/null http://localhost:7422/ 2>&1 | grep -q '401 Unauthorized'"]
      interval: 5s
      timeout: 5s
      retries: 60

  backend:
    image: mccutchen/go-httpbin:latest
    environment:
      MAX_BODY_SIZE: "2147483648" # 2G

  envoy:
    image: envoyproxy/envoy:v1.36-latest
    ports:
      - "8000:8000"
      - "9901:9901"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
      - ../target/wasm32-wasip1/release/crowdsec_wasm_bouncer.wasm:/etc/envoy/plugin.wasm
    environment:
      CROWDSEC_LAPI_KEY: "test-bouncer-key"
      CROWDSEC_APPSEC_KEY: "test-bouncer-key"
    depends_on:
      crowdsec:
        condition: service_healthy

  envoy-async:
    image: envoyproxy/envoy:v1.36-latest
    ports:
      - "8001:8000"
      - "9902:9901"
    volumes:
      - ./envoy-async.yaml:/etc/envoy/envoy.yaml
      - ../target/wasm32-wasip1/release/crowdsec_wasm_bouncer.wasm:/etc/envoy/plugin.wasm
    environment:
      CROWDSEC_LAPI_KEY: "test-bouncer-key"
      CROWDSEC_APPSEC_KEY: "test-bouncer-key"
    depends_on:
      crowdsec:
        condition: service_healthy

  envoy-failopen:
    image: envoyproxy/envoy:v1.36-latest
    ports:
      - "8002:8000"
      - "9903:9901"
    volumes:
      - ./envoy-failopen.yaml:/etc/envoy/envoy.yaml
      - ../target/wasm32-wasip1/release/crowdsec_wasm_bouncer.wasm:/etc/envoy/plugin.wasm
    environment:
      CROWDSEC_LAPI_KEY: "WRONG_KEY"
      CROWDSEC_APPSEC_KEY: "WRONG_KEY"
    depends_on:
      crowdsec:
        condition: service_healthy

  envoy-lapi:
    image: envoyproxy/envoy:v1.36-latest
    ports:
      - "8003:8000"
      - "9904:9901"
    volumes:
      - ./envoy-lapi.yaml:/etc/envoy/envoy.yaml
      - ../target/wasm32-wasip1/release/crowdsec_wasm_bouncer.wasm:/etc/envoy/plugin.wasm
    environment:
      CROWDSEC_LAPI_KEY: "test-bouncer-key"
      CROWDSEC_APPSEC_KEY: "test-bouncer-key"
    depends_on:
      crowdsec:
        condition: service_healthy

  slow-appsec:
    image: python:3-alpine
    command: python3 -u /slow_appsec.py
    environment:
      APPSEC_DELAY_MS: "800"
    volumes:
      - ./slow_appsec.py:/slow_appsec.py:ro

  envoy-slowappsec:
    image: envoyproxy/envoy:v1.36-latest
    ports:
      - "8004:8000"
      - "9905:9901"
    volumes:
      - ./envoy-slowappsec.yaml:/etc/envoy/envoy.yaml
      - ../target/wasm32-wasip1/release/crowdsec_wasm_bouncer.wasm:/etc/envoy/plugin.wasm
    environment:
      CROWDSEC_LAPI_KEY: "test-bouncer-key"
      CROWDSEC_APPSEC_KEY: "test-bouncer-key"
    depends_on:
      - slow-appsec

volumes:
  crowdsec-db:
  crowdsec-config:
